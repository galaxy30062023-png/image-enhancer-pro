<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Image Enhancer Pro - PicsArt Studio</title>
<!-- Google Fonts for Gujarati, Hindi & English -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Baloo+Bhai+2:wght@600;800&family=Hind+Vadodara:wght@500;700&family=Lobster&family=Noto+Sans+Devanagari:wght@600;800&family=Noto+Sans+Gujarati:wght@500;700&family=Pacifico&family=Poppins:wght@500;700&family=Rozha+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cloudflare.com">
<style>
  :root {
    --bg-dark: #0f0f13;
    --panel-bg: #181820;
    --accent: #7c3aed;
    --accent-grad: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
    --text-light: #f8fafc;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg-dark);
    color: var(--text-light);
    font-family: 'Poppins', 'Noto Sans Gujarati', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top Header */
  .header {
    height: 54px;
    background: var(--panel-bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    border-bottom: 1px solid #272732;
    z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
  .brand i { color: #f59e0b; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .btn-icon {
    background: #272734; color: #fff; border: none; border-radius: 8px;
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer;
  }
  .btn-icon:active { transform: scale(0.94); }
  .btn-save {
    background: var(--accent-grad); color: #fff; border: none; border-radius: 20px;
    padding: 7px 16px; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px;
    cursor: pointer; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.35);
  }

  /* Main Photo Workspace (Always Visible) */
  .workspace {
    flex: 1;
    position: relative;
    background: #09090c;
    background-image: radial-gradient(#1e1e28 1px, transparent 1px);
    background-size: 16px 16px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  #canvasWrapper {
    transform-origin: center center;
    transition: transform 0.05s ease-out;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    max-width: 92vw;
    max-height: 60vh;
    box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    border-radius: 4px;
  }

  /* Upload Placeholder */
  .upload-box {
    text-align: center; padding: 30px; border: 2px dashed #334155; border-radius: 20px;
    background: rgba(24, 24, 32, 0.8); cursor: pointer; max-width: 85%;
  }
  .upload-box i { font-size: 48px; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
  .upload-box h3 { font-size: 18px; margin-bottom: 6px; }
  .upload-box p { font-size: 12px; color: var(--text-muted); }

  /* Floating Overlay Controls on Canvas */
  .floating-controls {
    position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 15;
  }
  .float-btn {
    background: rgba(24, 24, 32, 0.85); backdrop-filter: blur(6px);
    color: #fff; border: 1px solid #333344; border-radius: 50%;
    width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
    font-size: 14px; cursor: pointer;
  }
  .zoom-badge {
    position: absolute; bottom: 10px; left: 12px;
    background: rgba(0,0,0,0.65); padding: 4px 10px; border-radius: 12px;
    font-size: 11px; color: #cbd5e1; pointer-events: none;
  }

  /* Bottom Panel (Sub-controls + Horizontal Main Menu) */
  .bottom-dock {
    background: var(--panel-bg);
    border-top: 1px solid #272732;
    z-index: 20;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* Sub-Tool Panel */
  .sub-panel {
    padding: 10px 14px;
    border-bottom: 1px solid #252530;
    display: none;
    animation: slideUp 0.2s ease;
  }
  .sub-panel.active { display: block; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Horizontal Scrollable Row */
  .h-scroll {
    display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .h-scroll::-webkit-scrollbar { display: none; }

  /* Main Bottom Toolbar */
  .main-tools {
    display: flex; overflow-x: auto; padding: 10px 8px; gap: 6px;
    scrollbar-width: none;
  }
  .main-tools::-webkit-scrollbar { display: none; }
  .tool-tab {
    min-width: 68px; display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: transparent; border: none; color: var(--text-muted); font-size: 11px;
    padding: 6px 4px; border-radius: 10px; cursor: pointer; flex-shrink: 0;
  }
  .tool-tab i { font-size: 18px; }
  .tool-tab.active { color: #fff; background: #272736; }
  .tool-tab.active i { color: #a855f7; }
  .tool-tab.ai-btn i { color: #38bdf8; }

  /* Chips & Sliders */
  .chip {
    background: #262633; color: #e2e8f0; border: 1px solid #353546;
    padding: 6px 12px; border-radius: 16px; font-size: 12px; white-space: nowrap; cursor: pointer;
  }
  .chip.active { background: var(--accent); border-color: #a855f7; color: #fff; font-weight: 600; }
  .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .slider-row span { font-size: 12px; min-width: 72px; color: #cbd5e1; }
  input[type=range] { flex: 1; accent-color: #8b5cf6; height: 5px; }

  /* Text Input Modal/Bar */
  .text-controls { display: flex; flex-direction: column; gap: 8px; }
  .text-input-row { display: flex; gap: 8px; }
  .text-input-row input {
    flex: 1; background: #262633; border: 1px solid #3f3f52; color: #fff;
    padding: 8px 12px; border-radius: 8px; font-size: 14px; outline: none;
  }
  .color-dot {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; flex-shrink: 0; cursor: pointer;
  }

  /* Loading Spinner */
  .loader {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; z-index: 99;
  }
  .spinner {
    width: 40px; height: 40px; border: 4px solid #333; border-top-color: #a855f7;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="brand">
    <i class="fas fa-crown"></i>
    <span>Image Enhancer Pro</span>
  </div>
  <div class="header-actions">
    <label for="fileInput" class="btn-icon" title="New Photo"><i class="fas fa-folder-open"></i></label>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <button class="btn-icon" id="undoBtn" title="Reset"><i class="fas fa-rotate-left"></i></button>
    <button class="btn-save" id="saveBtn"><i class="fas fa-download"></i> Save</button>
  </div>
</div>

<!-- Workspace -->
<div class="workspace" id="workspace">
  <label for="fileInput" class="upload-box" id="uploadBox">
    <i class="fas fa-wand-magic-sparkles"></i>
    <h3>ફોટો પસંદ કરો (Open Photo)</h3>
    <p>Pinch Zoom • Double Tap • 1-Finger Drag Zoom</p>
  </label>

  <div id="canvasWrapper" style="display:none;">
    <canvas id="canvas"></canvas>
  </div>

  <!-- Floating Controls -->
  <div class="floating-controls" id="floatControls" style="display:none;">
    <button class="float-btn" id="compareBtn" title="Hold for Before/After"><i class="fas fa-eye"></i></button>
    <button class="float-btn" id="resetZoomBtn" title="Fit Screen"><i class="fas fa-compress-arrows-alt"></i></button>
  </div>
  <div class="zoom-badge" id="zoomBadge" style="display:none;">100%</div>
</div>

<!-- Bottom Dock -->
<div class="bottom-dock" id="bottomDock" style="display:none;">
  
  <!-- 1. Adjust Sub-panel -->
  <div class="sub-panel" id="panel-adjust">
    <div class="h-scroll" id="adjustChips">
      <button class="chip active" data-adj="brightness">Brightness</button>
      <button class="chip" data-adj="contrast">Contrast</button>
      <button class="chip" data-adj="saturate">Saturation</button>
      <button class="chip" data-adj="sharpness">Sharpness</button>
      <button class="chip" data-adj="warmth">Warmth</button>
      <button class="chip" data-adj="vignette">Vignette</button>
    </div>
    <div class="slider-row">
      <span id="adjLabel">Brightness</span>
      <input type="range" id="adjSlider" min="-100" max="100" value="0">
      <span id="adjVal" style="min-width:35px; text-align:right;">0</span>
    </div>
  </div>

  <!-- 2. Filters Sub-panel -->
  <div class="sub-panel" id="panel-filters">
    <div class="h-scroll" id="filterChips">
      <button class="chip active" data-filter="none">Normal</button>
      <button class="chip" data-filter="vivid">HD Vivid</button>
      <button class="chip" data-filter="bw">B&W Pro</button>
      <button class="chip" data-filter="vintage">Vintage</button>
      <button class="chip" data-filter="sepia">Golden Sepia</button>
      <button class="chip" data-filter="cool">Cool Tone</button>
      <button class="chip" data-filter="drama">Drama</button>
    </div>
  </div>

  <!-- 3. Crop & Rotate Sub-panel -->
  <div class="sub-panel" id="panel-crop">
    <div class="h-scroll">
