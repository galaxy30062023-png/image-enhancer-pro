<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Enhancer Pro - Studio Edition</title>

<style>
:root {
    --bg-gradient: linear-gradient(135deg,#eef2ff,#fdf2f8,#ecfeff);
    --panel-bg: #ffffff;
    --text-color: #222222;
    --sub-text: #666666;
    --border-color: #eeeeee;
    --secondary-bg: #eee9ff;
    --secondary-text: #6335dc;
    --upload-bg: #faf7ff;
    --input-bg: #f5f3ff;
}

body.dark-mode {
    --bg-gradient: linear-gradient(135deg,#0f172a,#1e1b4b,#0f172a);
    --panel-bg: #1e293b;
    --text-color: #f8fafc;
    --sub-text: #94a3b8;
    --border-color: #334155;
    --secondary-bg: #312e81;
    --secondary-text: #c7d2fe;
    --upload-bg: #0f172a;
    --input-bg: #0f172a;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    transition: background-color 0.25s, color 0.25s;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg-gradient);
    color: var(--text-color);
    min-height: 100vh;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 30px;
    background: linear-gradient(120deg,#6c3bff,#ec4899,#ff8c42);
    color: white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.header-title h1 {
    font-size: 26px;
    margin-bottom: 4px;
}

.header-title p {
    font-size: 13px;
    opacity: 0.9;
}

.theme-btn {
    background: rgba(255,255,255,0.2);
    color: white;
    border: 1px solid rgba(255,255,255,0.4);
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
}

.container {
    max-width: 1250px;
    margin: 25px auto;
    padding: 15px;
}

.main {
    display: grid;
    grid-template-columns: 1fr 370px;
    gap: 22px;
}

.panel {
    background: var(--panel-bg);
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    border: 1px solid var(--border-color);
}

.upload-box {
    border: 2px dashed #9b70ff;
    border-radius: 15px;
    padding: 25px 15px;
    text-align: center;
    cursor: pointer;
    background: var(--upload-bg);
    display: block;
}

.upload-box:hover, .upload-box.dragover {
    border-color: #ec4899;
    opacity: 0.9;
}

.upload-box .upload-icon { font-size: 36px; margin-bottom: 6px; }
.upload-box h3 { color: #7c4dff; margin-bottom: 5px; font-size: 16px; }
.upload-box p { color: var(--sub-text); font-size: 12px; }

input[type=file] { display: none; }

.preview {
    margin-top: 18px;
    background: #111111;
    min-height: 340px;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    padding: 15px;
}

canvas {
    display: none;
    max-width: 100%;
    max-height: 520px;
    object-fit: contain;
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
}

#emptyMessage { color: #888; text-align: center; }

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 15px;
}

button, select, input[type=text] {
    border: none;
    padding: 10px 13px;
    border-radius: 9px;
    font-weight: 600;
    font-size: 12.5px;
}

button, select { cursor: pointer; }

.btn {
    background: linear-gradient(120deg,#7045ff,#ec4899);
    color: white;
}
.btn:hover { opacity: 0.9; }

.secondary {
    background: var(--secondary-bg);
    color: var(--secondary-text);
}

.danger {
    background: #ffe8e8;
    color: #e53935;
}

.section-heading {
    font-size: 15px;
    margin: 18px 0 10px;
    color: #7c4dff;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 6px;
}

.grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-bottom: 15px;
}

.preset, .crop-btn {
    background: var(--secondary-bg);
    color: var(--secondary-text);
    padding: 9px 4px;
    text-align: center;
}

.preset.active, .crop-btn.active {
    background: #713df2;
    color: white;
}

.control { margin-bottom: 14px; }
.control label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
}

input[type=range] {
    width: 100%;
    accent-color: #8b45f5;
    cursor: pointer;
}

.watermark-box {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.watermark-box input[type=text] {
    flex: 1;
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
}

.export-area {
    margin-top: 20px;
    border-top: 1px solid var(--border-color);
    padding-top: 16px;
    display: flex;
    gap: 10px;
}

.export-area select {
    width: 38%;
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
}

.download {
    flex: 1;
    padding: 13px;
    background: linear-gradient(120deg,#16c784,#0da8d5);
    color: white;
    font-size: 14px;
}

.footer {
    text-align: center;
    padding: 20px;
    color: var(--sub-text);
    font-size: 12px;
}

@media(max-width:900px) {
    .main { grid-template-columns: 1fr; }
    header { flex-direction: column; gap: 10px; text-align: center; }
}
</style>
</head>

<body>

<header>
    <div class="header-title">
        <h1>✨ Image Enhancer Pro</h1>
        <p>Studio-Grade Photo Enhancer, Cropper & Filter Tool</p>
    </div>
    <button class="theme-btn" id="themeToggle">🌙 Dark Mode</button>
</header>

<div class="container">
<div class="main">

<!-- LEFT: PREVIEW & EXPORT -->
<div class="panel">
    <label class="upload-box" id="uploadBox">
        <div class="upload-icon">📸</div>
        <h3>Upload or Drop Image Here</h3>
        <p>Supports High-Res JPG, PNG, WEBP (Max 30MB)</p>
        <input type="file" id="fileInput" accept="image/*">
    </label>

    <div class="preview" id="preview">
        <div id="emptyMessage">
            <div style="font-size:45px; margin-bottom:8px;">🖼️</div>
            Upload a photo to start editing
        </div>
        <canvas id="canvas"></canvas>
    </div>

    <div class="toolbar">
        <button class="secondary" id="zoomIn">🔍 +</button>
        <button class="secondary" id="zoomOut">🔍 -</button>
        <button class="secondary" id="rotate">🔄 Rotate</button>
        <button class="secondary" id="flipH">↔ Flip H</button>
        <button class="secondary" id="flipV">↕ Flip V</button>
        <button class="secondary" id="compare">👁 Compare</button>
        <button class="danger" id="reset">↩ Reset All</button>
    </div>

    <div class="export-area">
        <select id="format">
            <option value="image/png">PNG (HD)</option>
            <option value="image/jpeg">JPG (95%)</option>
            <option value="image/webp">WEBP</option>
        </select>
        <button class="download" id="download">⬇ Download HD Image</button>
    </div>
</div>

<!-- RIGHT: STUDIO CONTROLS -->
<div class="panel">
    <button class="btn" style="width:100%; padding:13px; font-size:14px;" id="autoEnhance">
        ⚡ 1-Click AI Auto Enhance
    </button>

    <!-- CROP RATIO -->
    <div class="section-heading">✂️ Crop Aspect Ratio</div>
    <div class="grid-3">
        <button class="crop-btn active" data-crop="free">Original</button>
        <button class="crop-btn" data-crop="1:1">1:1 Square</button>
        <button class="crop-btn" data-crop="4:5">4:5 Insta</button>
        <button class="crop-btn" data-crop="16:9">16:9 Wide</button>
        <button class="crop-btn" data-crop="9:16">9:16 Story</button>
        <button class="crop-btn" data-crop="4:3">4:3 Photo</button>
    </div>

    <!-- PRO FILTERS -->
    <div class="section-heading">🎨 Pro Color Filters</div>
    <div class="grid-3">
        <button class="preset active" data-preset="original">Normal</button>
        <button class="preset" data-preset="bright">Bright</button>
        <button class="preset" data-preset="vivid">Vivid</button>
        <button class="preset" data-preset="cinematic">Cinematic</button>
        <button class="preset" data-preset="golden">Golden</button>
        <button class="preset" data-preset="cool">Cool</button>
        <button class="preset" data-preset="vintage">Vintage</button>
        <button class="preset" data-preset="noir">B&W Noir</button>
        <button class="preset" data-preset="fade">Soft Fade</button>
    </div>

    <!-- MANUAL ADJUSTMENTS -->
    <div class="section-heading">🎛️ Fine Adjustments</div>
    <div id="controls">
        <div class="control">
            <label>☀ Brightness <span id="brightnessVal">100%</span></label>
            <input type="range" id="brightness" min="20" max="200" value="100">
        </div>
        <div class="control">
            <label>◐ Contrast <span id="contrastVal">100%</span></label>
            <input type="range" id="contrast" min="20" max="200" value="100">
        </div>
        <div class="control">
            <label>🌈 Saturation <span id="saturationVal">100%</span></label>
            <input type="range" id="saturation" min="0" max="200" value="100">
        </div>
        <div class="control">
            <label>✨ Sharpness <span id="sharpnessVal">0</span></label>
            <input type="range" id="sharpness" min="0" max="100" value="0">
        </div>
        <div class="control">
            <label>🌡 Temperature <span id="temperatureVal">0</span></label>
            <input type="range" id="temperature" min="-100" max="100" value="0">
        </div>
        <div class="control">
            <label>💧 Blur <span id="blurVal">0px</span></label>
            <input type="range" id="blur" min="0" max="10" value="0">
        </div>
    </div>

    <!-- WATERMARK -->
    <div class="section-heading">💧 Add Text Watermark</div>
    <div class="watermark-box">
        <input type="text" id="watermarkText" placeholder="Enter your name or brand...">
        <button class="secondary" id="applyWatermark">Apply</button>
    </div>
</div>

</div>
</div>

<div class="footer">
    Image Enhancer Pro Studio © 2026 | Commercial License Ready
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

const fileInput = document.getElementById("fileInput");
const uploadBox = document.getElementById("uploadBox");
const emptyMessage = document.getElementById("emptyMessage");

let originalImage = null;
let zoom = 1;
let rotation = 0;
let flipH = 1;
let flipV = 1;
let cropRatio = "free";
let watermark = "";
let showingOriginal = false;

const defaults = {
    brightness: 100,
    contrast: 100,
    saturation: 100,
    sharpness: 0,
    temperature: 0,
    blur: 0,
    grayscale: 0,
    sepia: 0
};

let settings = {...defaults};
const sliders = ["brightness", "contrast", "saturation", "sharpness", "temperature", "blur"];

// Dark Mode Toggle
document.getElementById("themeToggle").onclick = () => {
    document.body.classList.toggle("dark-mode");
    const isDark = document.body.classList.contains("dark-mode");
    document.getElementById("themeToggle").textContent = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
};

function loadImage(file) {
    if (!file || !file.type.startsWith("image/")) {
        alert("Please select a valid image file.");
        return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
        originalImage = img;
        resetState(false);
        emptyMessage.style.display = "none";
        canvas.style.display = "block";
        render();
        URL.revokeObjectURL(url);
    };
    img.src = url;
}

fileInput.addEventListener("change", e => loadImage(e.target.files[0]));
uploadBox.addEventListener("dragover", e => { e.preventDefault(); uploadBox.classList.add("dragover"); });
uploadBox.addEventListener("dragleave", () => uploadBox.classList.remove("dragover"));
uploadBox.addEventListener("drop", e => {
    e.preventDefault();
    uploadBox.classList.remove("dragover");
    loadImage(e.dataTransfer.files[0]);
});

function render() {
    if (!originalImage) return;

    let srcW = originalImage.naturalWidth;
    let srcH = originalImage.naturalHeight;
    let sx = 0, sy = 0, sWidth = srcW, sHeight = srcH;

    // Aspect Ratio Center Crop Calculation
    if (cropRatio !== "free") {
        const [rw, rh] = cropRatio.split(":").map(Number);
        const targetRatio = rw / rh;
        const currentRatio = srcW / srcH;

        if (currentRatio > targetRatio) {
            sWidth = srcH * targetRatio;
            sx = (srcW - sWidth) / 2;
        } else {
            sHeight = srcW / targetRatio;
            sy = (srcH - sHeight) / 2;
        }
    }

    const rotated = Math.abs(rotation % 180) === 90;
    canvas.width = rotated ? sHeight : sWidth;
    canvas.height = rotated ? sWidth : sHeight;

    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(rotation * Math.PI / 180);
    ctx.scale(flipH, flipV);

    if (showingOriginal) {
        ctx.filter = "none";
    } else {
        ctx.filter = `
            brightness(${settings.brightness}%)
            contrast(${settings.contrast}%)
            saturate(${settings.saturation}%)
            blur(${settings.blur}px)
            grayscale(${settings.grayscale}%)
            sepia(${settings.sepia}%)
        `;
    }

    ctx.drawImage(originalImage, sx, sy, sWidth, sHeight, -sWidth / 2, -sHeight / 2, sWidth, sHeight);
    ctx.restore();

    if (!showingOriginal) {
        applyTemperature();
        applySharpness();
        drawWatermark();
    }

    canvas.style.transform = `scale(${zoom})`;
}

function applyTemperature() {
    const amount = settings.temperature;
    if (amount === 0) return;
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    for (let i = 0; i < data.length; i += 4) {
        data[i] = Math.min(255, Math.max(0, data[i] + amount));
        data[i + 2] = Math.min(255, Math.max(0, data[i + 2] - amount));
    }
    ctx.putImageData(imageData, 0, 0);
}

function applySharpness() {
    const amount = settings.sharpness / 100;
    if (amount <= 0) return;
    const w = canvas.width, h = canvas.height;
    const source = ctx.getImageData(0, 0, w, h);
    const output = ctx.createImageData(w, h);
    const src = source.data, dst = output.data;
    const strength = amount * 2;

    for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
            const i = (y * w + x) * 4;
            for (let c = 0; c < 3; c++) {
                const center = src[i + c];
                const neighbors = src[i - w * 4 + c] + src[i + w * 4 + c] + src[i - 4 + c] + src[i + 4 + c];
                dst[i + c] = Math.max(0, Math.min(255, center + (center * 4 - neighbors) * strength / 4));
            }
            dst[i + 3] = src[i + 3];
        }
    }
    ctx.putImageData(output, 0, 0);
}

function drawWatermark() {
    if (!watermark.trim()) return;
    const fontSize = Math.max(18, Math.floor(canvas.width * 0.035));
    ctx.save();
    ctx.font = `bold ${fontSize}px Arial`;
    ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
    ctx.shadowColor = "rgba(0, 0, 0, 0.7)";
    ctx.shadowBlur = 4;
    ctx.textAlign = "right";
    ctx.fillText(watermark, canvas.width - 20, canvas.height - 20);
    ctx.restore();
}

// Sliders
sliders.forEach(key => {
    document.getElementById(key).addEventListener("input", e => {
        settings[key] = Number(e.target.value);
        updateLabel(key);
        document.querySelectorAll(".preset").forEach(b => b.classList.remove("active"));
        render();
    });
});

function updateLabel(key) {
    const suffix = ["brightness", "contrast", "saturation"].includes(key) ? "%" : key === "blur" ? "px" : "";
    document.getElementById(key + "Val").textContent = settings[key] + suffix;
}

function updateSliders() {
    sliders.forEach(key => {
        document.getElementById(key).value = settings[key];
        updateLabel(key);
    });
}

// Crop Buttons
document.querySelectorAll(".crop-btn").forEach(btn => {
    btn.onclick = () => {
        if (!originalImage) return alert("Upload an image first.");
        document.querySelectorAll(".crop-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        cropRatio = btn.dataset.crop;
        render();
    };
});

// Presets
const presets = {
    original: {...defaults},
    bright: {...defaults, brightness: 120, contrast: 110, saturation: 110},
    vivid: {...defaults, brightness: 105, contrast: 125, saturation: 150, sharpness: 30},
    cinematic: {...defaults, brightness: 95, contrast: 130, saturation: 85, temperature: -15, sharpness: 25},
    golden: {...defaults, brightness: 110, contrast: 110, saturation: 125, temperature: 35},
    cool: {...defaults, contrast: 110, saturation: 110, temperature: -30},
    vintage: {...defaults, brightness: 105, contrast: 90, saturation: 80, sepia: 40},
    noir: {...defaults, brightness: 105, contrast: 140, grayscale: 100, sharpness: 35},
    fade: {...defaults, brightness: 115, contrast: 80, saturation: 85}
};

document.querySelectorAll(".preset").forEach(btn => {
    btn.onclick = () => {
        if (!originalImage) return alert("Upload an image first.");
        settings = {...presets[btn.dataset.preset]};
        updateSliders();
        document.querySelectorAll(".preset").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        render();
    };
});

// Auto Enhance
document.getElementById("autoEnhance").onclick = () => {
    if (!originalImage) return alert("Upload an image first.");
    settings = {...defaults, brightness: 112, contrast: 118, saturation: 122, sharpness: 40};
    updateSliders();
    document.querySelectorAll(".preset").forEach(b => b.classList.remove("active"));
    render();
};

// Watermark
document.getElementById("applyWatermark").onclick = () => {
    if (!originalImage) return alert("Upload an image first.");
    watermark = document.getElementById("watermarkText").value;
    render();
};

// Toolbar Actions
document.getElementById("zoomIn").onclick = () => { zoom = Math.min(zoom + 0.15, 2.5); render(); };
document.getElementById("zoomOut").onclick = () => { zoom = Math.max(zoom - 0.15, 0.3); render(); };
document.getElementById("rotate").onclick = () => { if (originalImage) { rotation = (rotation + 90) % 360; render(); } };
document.getElementById("flipH").onclick = () => { if (originalImage) { flipH *= -1; render(); } };
document.getElementById("flipV").onclick = () => { if (originalImage) { flipV *= -1; render(); } };

document.getElementById("compare").onclick = () => {
    if (!originalImage) return;
    showingOriginal = !showingOriginal;
    document.getElementById("compare").textContent = showingOriginal ? "✨ Enhanced" : "👁 Compare";
    render();
};

function resetState(doRender = true) {
    settings = {...defaults};
    rotation = 0; zoom = 1; flipH = 1; flipV = 1;
    cropRatio = "free"; watermark = ""; showingOriginal = false;
    document.getElementById("watermarkText").value = "";
    document.getElementById("compare").textContent = "👁 Compare";
    document.querySelectorAll(".crop-btn").forEach(b => b.classList.remove("active"));
    document.querySelector('.crop-btn[data-crop="free"]').classList.add("active");
    document.querySelectorAll(".preset").forEach(b => b.classList.remove("active"));
    document.querySelector('.preset[data-preset="original"]').classList.add("active");
    updateSliders();
    if (doRender) render();
}

document.getElementById("reset").onclick = () => { if (originalImage) resetState(true); };

// Download
document.getElementById("download").onclick = () => {
    if (!originalImage) return alert("Please upload an image first.");
    const wasShowing = showingOriginal;
    showingOriginal = false;
    render();

    const format = document.getElementById("format").value;
    const ext = format === "image/jpeg" ? "jpg" : format === "image/webp" ? "webp" : "png";
    const link = document.createElement("a");
    link.download = `enhanced-pro-${Date.now()}.${ext}`;
    link.href = canvas.toDataURL(format, 0.95);
    link.click();

    showingOriginal = wasShowing;
    render();
};
</script>
</body>
</html>
